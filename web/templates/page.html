<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.File}} — planman</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/htmx.min.js"></script>
  <script src="/assets/mermaid.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">planman</span>
      <span class="filename">{{.File}}</span>
    </div>
    <div class="topbar-right">
      <input id="author" name="author" type="text" placeholder="Your name" title="Comment author name">
      <button class="btn" id="page-comment-btn"
              hx-get="/comment-form?page=1" hx-target="#page-form-slot" hx-swap="innerHTML">
        Comment on page
      </button>
      <button class="btn" id="open-editor-btn" hx-post="/editor" hx-swap="none"
              title="Opens $PLANMAN_EDITOR / $VISUAL / $EDITOR, or the system default">
        Open in editor
      </button>
      <button class="btn btn-primary" id="handback-btn"
              hx-post="/handback" hx-target="#main" hx-swap="innerHTML">
        Hand back to agent
      </button>
    </div>
  </header>
  <main id="main">
    <div id="doc">
      {{template "doc" .}}
    </div>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
